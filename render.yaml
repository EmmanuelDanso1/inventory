services:
  - type: web
    name: inventorydb
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn "invent_app:create_app()"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: inventorydb-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: inventory_db
    databaseName: inventory_db
    plan: free